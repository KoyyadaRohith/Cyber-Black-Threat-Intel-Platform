{% extends "base.html" %}

{% block title %}Reset Password - Cyber Black Threat Intel Platform{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    
    .auth-card {
        width: 100%;
        max-width: 440px;
        padding: 40px 30px;
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .auth-title {
        font-size: 1.5rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    .auth-subtitle {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-top: 4px;
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }
    
    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
    }
    
    .auth-footer a:hover {
        text-decoration: underline;
    }

    /* Live checklist status indicators */
    .rule {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        transition: all 0.3s ease;
    }
    .rule.valid {
        color: var(--color-safe);
    }
    .rule.valid i {
        color: var(--color-safe) !important;
    }
    .rule.invalid i {
        color: var(--color-malicious) !important;
    }
</style>

<div class="auth-wrapper">
    <div class="glass-panel auth-card">
        <div class="auth-header">
            <div style="width: 52px; height: 52px; border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0, 240, 255, 0.05); margin: 0 auto 15px; box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);">
                <img src="{{ url_for('static', filename='img/logo_shield.png') }}" style="width: 100%; height: 100%; object-fit: cover;" alt="Logo">
            </div>
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Verify email to reset analyst login credentials</p>
        </div>
        
        <!-- Live AJAX Alert Banner -->
        <div id="alert-banner" style="display: none; border-radius: 6px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.85rem; align-items: center; gap: 10px;">
            <i id="alert-icon" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
            <span id="alert-text"></span>
        </div>
        
        <form id="forgot-password-form" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Registered Corporate Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="analyst@company.com" required autocomplete="email">
            </div>

            <div class="form-group" style="position: relative;">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                <!-- Strength Indicator Bar -->
                <div class="strength-bar-container" style="height: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 2px; margin-top: 8px; overflow: hidden;">
                    <div id="strength-bar" style="height: 100%; width: 0%; transition: all 0.3s ease; background: var(--color-malicious);"></div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                    <span id="strength-label" style="font-size: 0.72rem; color: var(--text-muted);">Strength: Weak</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <!-- Validation Checklist Panel -->

            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;" disabled>
                <i data-lucide="key-round" id="btn-icon"></i>
                <span id="btn-text">Reset Password</span>
            </button>
        </form>
        
        <div class="auth-footer">
            <span>Remember access keys?</span>
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('forgot-password-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');
    const submitBtn = document.getElementById('submit-btn');
    const strengthBar = document.getElementById('strength-bar');
    const strengthLabel = document.getElementById('strength-label');
    const btnIcon = document.getElementById('btn-icon');
    const btnText = document.getElementById('btn-text');
    const alertBanner = document.getElementById('alert-banner');
    const alertIcon = document.getElementById('alert-icon');
    const alertText = document.getElementById('alert-text');

    // Checklist Elements
    const rules = {
        length: { el: document.getElementById('rule-length'), check: (val) => val.length >= 8 },
        upper: { el: document.getElementById('rule-upper'), check: (val) => /[A-Z]/.test(val) },
        lower: { el: document.getElementById('rule-lower'), check: (val) => /[a-z]/.test(val) },
        number: { el: document.getElementById('rule-number'), check: (val) => /\d/.test(val) },
        special: { el: document.getElementById('rule-special'), check: (val) => /[!@#$%^&*(),.?":{}|<>]/.test(val) },
        match: { el: document.getElementById('rule-match'), check: (val) => val && val === passwordInput.value }
    };

    function validatePassword() {
        const val = passwordInput.value;
        const confirmVal = confirmInput.value;
        let validCount = 0;

        // Check each strength rule
        for (const [key, rule] of Object.entries(rules)) {
            let pass = false;
            if (key === 'match') {
                pass = rule.check(confirmVal);
            } else {
                pass = rule.check(val);
            }

            if (pass) {
                rule.el.classList.remove('invalid');
                rule.el.classList.add('valid');
                const icon = rule.el.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', 'check');
                    icon.style.color = 'var(--color-safe)';
                }
                validCount++;
            } else {
                rule.el.classList.remove('valid');
                rule.el.classList.add('invalid');
                const icon = rule.el.querySelector('i');
                if (icon) {
                    icon.setAttribute('data-lucide', 'x');
                    icon.style.color = 'var(--color-malicious)';
                }
            }
        }
        if (window.lucide) window.lucide.createIcons();

        // Calculate strength bar percentage
        let strengthPoints = 0;
        if (val.length >= 8) strengthPoints++;
        if (/[A-Z]/.test(val)) strengthPoints++;
        if (/[a-z]/.test(val)) strengthPoints++;
        if (/\d/.test(val)) strengthPoints++;
        if (/[!@#$%^&*(),.?":{}|<>]/.test(val)) strengthPoints++;

        let percentage = (strengthPoints / 5) * 100;
        strengthBar.style.width = `${percentage}%`;

        if (strengthPoints <= 2) {
            strengthBar.style.backgroundColor = 'var(--color-malicious)';
            strengthLabel.textContent = 'Strength: Weak';
            strengthLabel.style.color = 'var(--color-malicious)';
        } else if (strengthPoints <= 4) {
            strengthBar.style.backgroundColor = 'var(--color-suspicious)';
            strengthLabel.textContent = 'Strength: Medium';
            strengthLabel.style.color = 'var(--color-suspicious)';
        } else {
            strengthBar.style.backgroundColor = 'var(--color-safe)';
            strengthLabel.textContent = 'Strength: Strong';
            strengthLabel.style.color = 'var(--color-safe)';
        }

        // Enable button only if all rules are satisfied and email is provided
        const allValid = Object.values(rules).every((rule, index) => {
            if (index === 5) return rule.check(confirmVal); // check match
            return rule.check(val);
        });

        if (allValid && emailInput.value.trim() !== '') {
            submitBtn.removeAttribute('disabled');
        } else {
            submitBtn.setAttribute('disabled', 'true');
        }
    }

    passwordInput.addEventListener('input', validatePassword);
    confirmInput.addEventListener('input', validatePassword);
    emailInput.addEventListener('input', validatePassword);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Final UI checks
        submitBtn.setAttribute('disabled', 'true');
        btnText.textContent = 'Processing Security Reset...';
        btnIcon.setAttribute('data-lucide', 'loader-2');
        btnIcon.style.animation = 'spin 1s linear infinite';
        if (window.lucide) window.lucide.createIcons();

        const payload = {
            email: emailInput.value.trim(),
            new_password: passwordInput.value.trim(),
            confirm_password: confirmInput.value.trim()
        };

        try {
            const response = await fetch("{{ url_for('forgot_password') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                // Show gorgeous success banner
                alertBanner.style.display = 'flex';
                alertBanner.style.background = 'rgba(16, 185, 129, 0.1)';
                alertBanner.style.border = '1px solid rgba(16, 185, 129, 0.25)';
                alertBanner.style.color = 'var(--color-safe)';
                alertText.textContent = result.message + " Redirecting to Sign In...";
                alertIcon.setAttribute('data-lucide', 'check-circle');
                alertIcon.style.color = 'var(--color-safe)';
                if (window.lucide) window.lucide.createIcons();

                // Wait 1.5s then redirect to Login
                setTimeout(() => {
                    window.location.href = "{{ url_for('login') }}";
                }, 1500);

            } else {
                throw new Error(result.message || 'Error occurred.');
            }

        } catch (err) {
            // Show error alert
            alertBanner.style.display = 'flex';
            alertBanner.style.background = 'rgba(255, 0, 85, 0.1)';
            alertBanner.style.border = '1px solid rgba(255, 0, 85, 0.25)';
            alertBanner.style.color = 'var(--color-malicious)';
            alertText.textContent = err.message || 'Invalid email or unable to reset password.';
            alertIcon.setAttribute('data-lucide', 'alert-circle');
            alertIcon.style.color = 'var(--color-malicious)';
            if (window.lucide) window.lucide.createIcons();

            // Reset submit button states
            submitBtn.removeAttribute('disabled');
            btnText.textContent = 'Reset Password';
            btnIcon.setAttribute('data-lucide', 'key-round');
            btnIcon.style.animation = 'none';
            if (window.lucide) window.lucide.createIcons();
        }
    });

    // Custom spin keyframe
    const style = document.createElement('style');
    style.innerHTML = `
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(style);
});
</script>
{% endblock %}
